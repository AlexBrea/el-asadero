<!DOCTYPE html>
<html lang="es">
<head>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>El Asadero</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1b1330;font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
canvas#c{touch-action:none;position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px;pointer-events:none;z-index:3}
#hud>*{pointer-events:auto}
#lvl{background:rgba(20,10,40,.72);border:2px solid #ffd24a;border-radius:14px;padding:6px 14px;font-weight:800;letter-spacing:.5px;font-size:15px;line-height:1.2}
#lvl small{display:block;font-weight:600;color:#ffe9a0;font-size:12px}
#pips{display:flex;gap:8px;align-items:center;background:rgba(20,10,40,.72);padding:8px 14px;border-radius:30px}
#pips:empty{display:none}
.pip{width:22px;height:22px;border-radius:50%;background:#4a3d6b;border:2px solid #fff3;display:grid;place-items:center;font-size:12px;font-weight:900}
.pip.w{background:#3ecf6a;border-color:#b9ffd0}.pip.l{background:#e94b5b;border-color:#ffc0c6}
.btns{display:flex;gap:8px}
.btns button,.sm{background:rgba(20,10,40,.78);color:#fff;border:2px solid #fff4;border-radius:12px;padding:8px 12px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.btns button:active,.sm:active{transform:scale(.95)}
.ros{position:fixed;top:64px;left:12px;max-width:46vw;background:rgba(40,120,255,.55);border:2px solid #9cc4ff;border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px;line-height:1.55;min-height:34px;z-index:2}
.ros.r{left:auto;right:12px;background:rgba(235,60,80,.55);border-color:#ffb0ba;text-align:right}
.ros b{display:block;font-size:11px;letter-spacing:1px;opacity:.85}
.chip{display:inline-block;margin:0 6px 0 0;white-space:nowrap}
.ros.r .chip{margin:0 0 0 6px}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:min(12vw,88px);font-weight:900;letter-spacing:2px;pointer-events:none;opacity:0;text-shadow:0 5px 0 #0008,0 0 30px #000a;-webkit-text-stroke:3px #1b1330;paint-order:stroke fill;z-index:3}
#banner.show{animation:pop 1.5s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(1.15)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#panel{position:fixed;left:0;right:0;bottom:0;padding:12px 12px 16px;background:linear-gradient(0deg,rgba(15,8,32,.96) 70%,rgba(15,8,32,0));display:none;text-align:center;z-index:3}
#panel.on{display:block}
#ptitle{font-weight:900;font-size:clamp(15px,2.6vw,22px);margin-bottom:10px;color:#ffe08a;text-shadow:0 2px 0 #0007}
#cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.card{width:min(30vw,230px);min-width:150px;background:linear-gradient(160deg,#4b3a86,#2c2152);border:3px solid #ffd24a;border-radius:18px;padding:10px 10px 12px;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 6px 0 #0007}
.card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 12px 0 #0006,0 0 24px #ffd24a88}
.card:active{transform:scale(.97)}
.ic{width:100%;height:clamp(64px,13vh,104px);display:block;margin:0 auto 4px}
.card .em{font-size:clamp(26px,5.5vw,38px);line-height:1.15;min-height:1.1em;overflow:hidden;white-space:nowrap}
.card .nm{font-weight:900;font-size:clamp(14px,2.6vw,18px);margin-top:2px}
.card .ds{font-size:clamp(11px,2vw,13px);color:#d9ceff;margin-top:4px;font-weight:700}
.card .lv{font-size:12px;color:#ffe08a;font-weight:900;margin-top:4px}
.card.up{border-color:#33d6ff;background:linear-gradient(160deg,#1f5f86,#1d2c52)}
.btn{background:linear-gradient(#ffd24a,#ff9d1e);color:#2a1448;border:none;border-radius:16px;padding:14px 26px;font-size:clamp(16px,3vw,21px);font-weight:900;cursor:pointer;box-shadow:0 6px 0 #a35b00;font-family:inherit}
.btn.alt{background:linear-gradient(#6fd3ff,#2d8fe0);box-shadow:0 6px 0 #145a9a;color:#0b2342}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a35b00}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px}
#modal{position:fixed;inset:0;background:rgba(10,5,25,.8);display:grid;place-items:center;padding:16px;z-index:6}
#modal.off{display:none}
.box{max-width:560px;text-align:center;background:linear-gradient(160deg,#3b2c6e,#241a47);border:4px solid #ffd24a;border-radius:26px;padding:26px 24px;box-shadow:0 10px 0 #0008}
.box h1{font-size:clamp(26px,6vw,40px);line-height:1.1;margin-bottom:10px;color:#ffe08a;text-shadow:0 3px 0 #0008}
.box p{font-size:clamp(14px,2.6vw,17px);line-height:1.5;margin-bottom:16px;color:#ece6ff}
.box .big{font-size:clamp(34px,8vw,56px);margin-bottom:6px}
.inp{display:block;width:100%;max-width:320px;margin:0 auto 10px;padding:13px 14px;border-radius:14px;border:3px solid #6a58b8;background:#1b1330;color:#fff;font-size:17px;font-family:inherit;outline:none;user-select:text;-webkit-user-select:text}
.inp:focus{border-color:#ffd24a}
.err{min-height:22px;color:#ff8a98;font-weight:800;font-size:14px;margin:2px 0 10px}
.rank{max-height:48vh;overflow-y:auto;margin-bottom:12px;text-align:left}
.ac{display:flex;gap:10px;align-items:center;padding:8px 6px;margin-bottom:6px;border-radius:12px;background:rgba(255,255,255,.06)}
.medw{perspective:260px;flex:none;width:64px}
.med{display:block;margin:0 auto;filter:drop-shadow(0 3px 3px rgba(0,0,0,.55))}
.medw .med{animation:medspin 4.5s ease-in-out infinite}
@keyframes medspin{0%,100%{transform:rotateY(-26deg)}50%{transform:rotateY(26deg)}}
.acb{flex:1;min-width:0;text-align:left}
.pb{height:5px;border-radius:3px;background:rgba(255,255,255,.15);margin:4px 0;overflow:hidden}.pb i{display:block;height:100%;background:#f5c542}
.mm{display:flex;gap:8px;margin-top:3px}.mi{display:flex;flex-direction:column;align-items:center;font-size:9px;opacity:.95}
.rk{display:flex;gap:12px;align-items:center;padding:8px 12px;border-radius:12px;background:#ffffff14;margin-bottom:6px;font-weight:800}
.rk span:first-child{width:38px;text-align:center}
.rk .nmu{flex:1;overflow:hidden;text-overflow:ellipsis}
.rk.me{background:#ffd24a33;border:2px solid #ffd24a}
.rk{flex-wrap:wrap;cursor:pointer}
.rk .tm{font-size:12px;color:#c9bff0;font-weight:700;margin-left:6px}
.rkd{display:none;flex-basis:100%;font-size:13px;font-weight:600;color:#d9ceff;line-height:1.45;padding:4px 2px 2px;text-align:left}
.rk.open .rkd{display:block}
.sc{background:#ffffff14;border-radius:14px;padding:10px 14px;margin-bottom:10px;text-align:left}
.sc h3{color:#ffe08a;margin-bottom:6px;font-size:17px}
.sr{display:flex;justify-content:space-between;gap:12px;font-weight:700;font-size:15px;padding:2px 0;border-bottom:1px solid #ffffff10}
.sr:last-child{border-bottom:none}
.sr b{color:#7bed9f;text-align:right}

html,body{touch-action:manipulation}
#hud{padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 6px calc(10px + env(safe-area-inset-left))}
#menu{width:54px;height:54px;flex:none;border-radius:16px;background:linear-gradient(#ffd24a,#ff9d1e);color:#2a1448;border:3px solid #fff6;font-size:30px;font-weight:900;line-height:1;cursor:pointer;box-shadow:0 4px 0 #a35b00;font-family:inherit}
#menu:active{transform:translateY(3px);box-shadow:0 1px 0 #a35b00}
#hud .mid{flex:1;display:flex;justify-content:center;min-width:0;pointer-events:none}
#hud .mid>*{pointer-events:auto}
#spd{flex:none;height:54px;min-width:64px;border-radius:16px;font-size:22px;font-weight:900;letter-spacing:1px;color:#0b2342;background:linear-gradient(#8fe0ff,#2d8fe0);border:3px solid #ffffffaa;box-shadow:0 5px 0 #145a9a,0 8px 10px #0006,inset 0 2px 0 #fff8;text-shadow:0 1px 0 #fff8}
#spd:active{transform:translateY(4px);box-shadow:0 1px 0 #145a9a,0 2px 4px #0006,inset 0 2px 0 #fff8}
#drawer{position:fixed;top:0;left:0;bottom:0;width:min(88vw,380px);z-index:9;background:linear-gradient(170deg,#3b2c6e,#1d1440);border-right:4px solid #ffd24a;box-shadow:8px 0 30px #000a;transform:translateX(-105%);transition:transform .22s ease-out;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left)}
#drawer.open{transform:none}
#drawer .dh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:22px;font-weight:900;color:#ffe08a;letter-spacing:1px}
#drawer .dh button{width:48px;height:48px;border-radius:14px;background:#ffffff22;border:2px solid #fff4;color:#fff;font-size:24px;font-weight:900;cursor:pointer;font-family:inherit}
#drawer .dbody{flex:1;overflow-y:auto;padding:4px 12px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.di{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:10px;padding:16px 14px;border-radius:16px;background:#ffffff1c;border:2px solid #ffffff30;color:#fff;font-size:18px;font-weight:900;text-align:left;cursor:pointer;font-family:inherit}
.di:active{background:#ffffff38}
.di.hide{display:none}
.di .ar{margin-left:auto;opacity:.7}
.drow{display:flex;gap:10px;margin-bottom:10px}
.drow .di{margin:0;flex:1;justify-content:center;text-align:center;padding:14px 6px;font-size:16px}
.di.off{opacity:.45}
#dstats{display:none;margin-bottom:10px}
#dstats.on{display:block}
#dstats .sc{background:#ffffff14;border-radius:14px;padding:8px 12px;margin-bottom:8px;text-align:left}
#dstats .sc h3{color:#ffe08a;margin-bottom:4px;font-size:15px}
#dstats .sr{font-size:13px}
#dstats .note{font-size:12px;color:#c9bff0;margin-bottom:8px}
@media (max-width:700px),(max-height:500px){
  #lvl{padding:4px 10px;font-size:13px;border-width:2px}
  #lvl small{display:none}
  #pips{padding:6px 12px}
  #pips>div{font-size:13px!important}
  .ros{top:calc(70px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));max-width:47vw;font-size:11px;padding:3px 8px;min-height:0;line-height:1.35;border-width:2px;border-radius:10px}
  .ros.r{left:auto;right:calc(8px + env(safe-area-inset-right))}
  .ros b{font-size:9px}
  .chip{margin:0 4px 0 0}
  #panel{padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
  #ptitle{font-size:15px;margin-bottom:6px}
  #cards{gap:8px;flex-wrap:nowrap}
  .card{width:calc((100vw - 40px)/3);min-width:0;max-width:200px;padding:6px 6px 8px;border-width:2px;border-radius:14px}
  .ic{height:clamp(54px,11vh,92px)}
  .card .nm{font-size:13px;line-height:1.15}
  .card .ds{font-size:10px;line-height:1.25;margin-top:2px}
  .box{padding:16px 14px;border-width:3px;border-radius:20px;max-height:92vh;overflow-y:auto}
  .box p{margin-bottom:12px}
  .btn{padding:12px 20px}
  #banner{top:24%}
}
@media (max-height:500px){
  #menu,#spd{height:44px}#spd{font-size:18px}#menu{width:44px;font-size:24px}
  .ros{top:calc(56px + env(safe-area-inset-top))}
  .ic{height:46px}
  .card .ds{display:none}
}
#fpv{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;z-index:4;background:linear-gradient(#6fd3ff,#2d8fe0);color:#0b2342;border:3px solid #fff7;font-size:28px;line-height:1;cursor:pointer;box-shadow:0 4px 0 #145a9a;font-family:inherit}
#fpv:active{transform:translateY(3px);box-shadow:0 1px 0 #145a9a}
#fpv.on{background:linear-gradient(#ffd24a,#ff9d1e);box-shadow:0 4px 0 #a35b00}
#panel.on ~ #fpv,#modal:not(.off) ~ #fpv{display:none}
#fpv.hide{display:none}
#cards.tgt{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 6px}
#cards.tgt .card{width:auto;min-width:0;max-width:none;padding:6px 6px 8px}
#cards.tgt .ic{height:clamp(44px,9vh,70px)}
#cards.tgt .card .nm{font-size:13px}
#cards.tgt .card .ds{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:10px;line-height:1.25}
@media (min-width:700px) and (min-height:501px){#cards.tgt{grid-template-columns:repeat(auto-fit,minmax(150px,230px));justify-content:center}}
@media (max-height:500px){#cards.tgt{grid-template-columns:repeat(auto-fit,minmax(120px,1fr));max-height:42vh}}

#tabbar{position:fixed;left:0;right:0;bottom:0;display:none;gap:8px;justify-content:center;z-index:7;background:linear-gradient(#2a1d52,#170f33);border-top:3px solid #ffd24a;padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
#tabbar button{position:relative;flex:1;max-width:190px;display:flex;flex-direction:column;align-items:center;gap:1px;background:#ffffff12;border:2px solid transparent;border-radius:14px;color:#d9ceff;font-size:22px;font-weight:900;padding:5px 4px;cursor:pointer;font-family:inherit}
#tabbar button span{font-size:12px}
#tabbar button.on{background:#ffd24a;color:#2a1448;border-color:#fff3a0}
#tabbar button i{display:none;position:absolute;top:3px;right:22%;width:11px;height:11px;border-radius:50%;background:#ff4f5e;border:2px solid #170f33}
body.hastab #modal{padding-bottom:86px}
body.hastab .box{max-height:calc(100vh - 100px);overflow-y:auto}
.coin{display:inline-block;background:#ffffff1c;border:2px solid #ffd24a;border-radius:20px;padding:3px 14px;font-weight:900;margin:0 auto 10px;font-size:16px}
.stabs{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.stabs button{background:#ffffff14;color:#d9ceff;border:2px solid #6a58b8;border-radius:12px;padding:6px 12px;font-weight:900;font-size:13px;cursor:pointer;font-family:inherit}
.stabs button.on{background:#ffd24a;color:#2a1448;border-color:#fff3a0}
.tabv h1{font-size:clamp(22px,5vw,32px);margin-bottom:6px}
.tabv .skg{max-height:40vh}
.tabv .sm{font-size:13px;margin-bottom:10px}
.sk .rar{font-size:10px;font-weight:900;text-transform:uppercase}
.sk .pr{font-weight:900;color:#ffe08a;font-size:13px;margin-top:3px}
.skg.bp{grid-template-columns:repeat(auto-fit,minmax(86px,1fr))}
.lst{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.ms{display:flex;align-items:center;gap:10px;background:#ffffff12;border:2px solid #6a58b8;border-radius:14px;padding:8px 10px;text-align:left}
.ms.cl{opacity:.55}
.ms .mt{flex:1}
.ms .mt small{font-size:12px;color:#c9bff0}
.ms .btn{padding:8px 14px;font-size:15px;white-space:nowrap}
.ms .btn:disabled{opacity:.6;cursor:default}
.ic.hen{height:clamp(110px,24vh,190px);margin-bottom:8px}
.ic.none{display:grid;place-items:center;font-size:34px;color:#8f84c4;height:84px}
#toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-24px);background:linear-gradient(#ffe27a,#ff9d1e);color:#2a1448;font-weight:900;font-size:15px;padding:10px 18px;border-radius:16px;box-shadow:0 5px 0 #a35b00,0 10px 20px #0006;z-index:8;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;text-align:center;max-width:92vw;line-height:1.35}
#toast.show{opacity:1;transform:translateX(-50%)}
.lvbox{background:#ffffff14;border-radius:14px;padding:8px 14px;margin:0 auto 12px;max-width:380px;font-weight:900}
.lvbox em{font-style:normal;color:#ffe08a}
.xpbar{height:12px;border-radius:8px;background:#0007;margin:6px 0 3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7bed9f,#ffd24a);border-radius:8px}
.lvbox small{font-size:12px;color:#c9bff0;font-weight:700}
.skg{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;padding:2px;text-align:center}
.sk{background:linear-gradient(160deg,#4b3a86,#2c2152);border:3px solid #6a58b8;border-radius:14px;padding:6px 6px 8px;cursor:pointer}
.sk.sel{border-color:#ffd24a;box-shadow:0 0 16px #ffd24a99}
.sk.lock{opacity:.5;filter:grayscale(.7);cursor:default}
.sk .ic{height:84px}
.sk .nm{font-weight:900;font-size:13px}
.sk .ds{font-size:10px;color:#d9ceff;font-weight:700;line-height:1.25;margin-top:2px}
.spl{max-height:48vh;overflow-y:auto;margin-bottom:12px;text-align:left;-webkit-overflow-scrolling:touch}
.spc{display:flex;gap:12px;align-items:center;padding:10px 12px;margin-bottom:8px;border-radius:14px;background:#ffffff14;border:3px solid #ffffff22;cursor:pointer}
.spc.sel{border-color:var(--c);background:#ffffff26;box-shadow:0 0 14px var(--c)}
.spc .ic{width:84px;height:84px;flex:none;margin:0}
.card .ult{margin-top:5px;font-size:11px;font-weight:900;color:#2a1448;background:linear-gradient(#ffe27a,#ffb81a);border-radius:8px;padding:3px 5px;line-height:1.25}
.card .ult small{display:block;font-size:10px;font-weight:700;margin-top:1px}
.card.ultc{box-shadow:0 6px 0 #0007,0 0 20px #ffd700aa;animation:ultp 1.4s ease-in-out infinite}
@keyframes ultp{50%{box-shadow:0 6px 0 #0007,0 0 32px #ffd700}}
.spt b{display:block;font-size:17px;color:var(--c)}
.spt span{display:block;font-size:13px;line-height:1.35;color:#ece6ff}
.spt small{display:block;font-size:11px;color:#c9bff0;margin-top:3px;line-height:1.35}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <button id="menu" aria-label="Menú">☰</button>
  <div class="mid"><div id="lvl"></div><div id="pips"></div></div>
  <button id="spd">x1</button>
</div>
<div id="drawer">
  <div class="dh"><span>🐔 MENÚ</span><button id="dclose" aria-label="Cerrar">✕</button></div>
  <div class="dbody">
    <button class="di" id="d-stats">📊 Estadísticas<span class="ar">▾</span></button>
    <div id="dstats"></div>
    <div class="drow"><button class="di" id="d-mus">🎵 Música</button><button class="di" id="d-snd">🔊 Sonido</button></div>
    <button class="di" id="d-rank">🏆 Ranking</button>
    <button class="di" id="d-home">🏠 Menú principal</button>
    <button class="di" id="d-out">🚪 Cerrar sesión</button>
  </div>
</div>
<div class="ros" id="rosL"></div>
<div class="ros r" id="rosR"></div>
<div id="banner"></div>
<div id="toast"></div>
<div id="panel"><div id="ptitle"></div><div id="cards"></div></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<nav id="tabbar"><button data-t="game" onclick="tabGo('game')">🎮<span>Jugar</span></button><button data-t="shop" onclick="tabGo('shop')">🛍️<span>Tienda</span><i></i></button><button data-t="chest" onclick="tabGo('chest')">🎁<span>Cofres</span><i></i></button><button data-t="hen" onclick="tabGo('hen')">🐔<span>Mi gallina</span></button></nav>
<button id="fpv" class="hide" aria-label="Vista en primera persona">👁️</button>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
