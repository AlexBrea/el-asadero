<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#171323" />
    <title>El Asadero</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="stylesheet" href="assets/css/game.css" />
    <link rel="stylesheet" href="assets/css/features.css" />
    <link rel="stylesheet" href="assets/css/chests.css" />
    <link rel="stylesheet" href="assets/css/interface.css" />
    <link rel="stylesheet" href="assets/css/motion.css" />
    <link rel="stylesheet" href="assets/css/run-intro.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <button id="menu" aria-label="Menú">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <use href="assets/icons.svg#menu"></use>
        </svg>
      </button>
      <div class="mid">
        <div id="lvl"></div>
        <div id="pips"></div>
      </div>
      <button id="spd">x1</button>
    </div>
    <div id="drawer">
      <div class="dh">
        <span
          ><svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <use href="assets/icons.svg#chicken"></use>
          </svg>
          MENÚ</span
        ><button id="dclose" aria-label="Cerrar">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <use href="assets/icons.svg#x"></use>
          </svg>
        </button>
      </div>
      <div class="dbody">
        <button class="di" id="d-stats">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <use href="assets/icons.svg#chart"></use>
          </svg>
          Estadísticas<span class="ar">▾</span>
        </button>
        <div id="dstats"></div>
        <div class="drow">
          <button class="di" id="d-mus">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <use href="assets/icons.svg#music"></use>
            </svg>
            Música</button
          ><button class="di" id="d-snd">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <use href="assets/icons.svg#volume"></use>
            </svg>
            Sonido
          </button>
        </div>
        <button class="di" id="d-rank">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <use href="assets/icons.svg#trophy"></use>
          </svg>
          Ranking
        </button>
        <button class="di" id="d-home">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <use href="assets/icons.svg#home"></use>
          </svg>
          Menú principal
        </button>
        <button class="di" id="d-out">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <use href="assets/icons.svg#logout"></use>
          </svg>
          Cerrar sesión
        </button>
      </div>
    </div>
    <nav id="tabbar">
      <button data-t="game">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <use href="assets/icons.svg#target"></use></svg
        ><span>Jugar</span></button
      ><button data-t="shop">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <use href="assets/icons.svg#gift"></use></svg
        ><span>Tienda</span><i></i></button
      ><button data-t="chest">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <use href="assets/icons.svg#gift"></use></svg
        ><span>Cofres</span><i></i></button
      ><button data-t="hen">
        <svg
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <use href="assets/icons.svg#chicken"></use></svg
        ><span>Mi gallina</span>
      </button>
    </nav>
    <div class="ros" id="rosL"></div>
    <div class="ros r" id="rosR"></div>
    <div id="banner"></div>
    <div id="toast"></div>
    <section id="panel" aria-labelledby="ptitle" aria-hidden="true" inert>
      <div class="selection-head">
        <p id="selection-meta"></p>
        <h2 id="ptitle"></h2>
      </div>
      <div id="cards"></div>
      <div id="rarity-guide"></div>
    </section>
    <div id="modal">
      <div class="box" id="mbox"><p role="status">Cargando el corral…</p></div>
    </div>
    <div id="entrance-ui" hidden>
      <button id="skip-entrance" class="btn alt" type="button">Saltar intro</button>
    </div>
    <button id="fpv" class="hide" aria-label="Vista en primera persona">
      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <use href="assets/icons.svg#eye"></use>
      </svg>
    </button>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
